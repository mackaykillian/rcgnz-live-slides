<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Badge renderer</title>
    <style>
      /* PDFs: one badge per page (Figma frame size, in points). The Worker prints at 4/3 scale so 1 CSS px = 1 pt. */
      @page { size: 267.12pt 414pt; margin: 0; }
      @media print {
        [data-screen-only] { display: none; }
        .badge-page { break-after: page; }
        .badge-page:last-child { break-after: auto; }
      }
    </style>
  </head>
  <!-- Headless page the Worker's browser loads to render badges (see worker/badges/render.ts). Holds no data itself. -->
  <body style="margin: 0; background: #ffffff">
    <div id="root"></div>
    <script type="module" src="/src/badges/render-main.tsx"></script>
  </body>
</html>
